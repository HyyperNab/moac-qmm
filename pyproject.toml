[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moac-qmm"
version = "29.1.0"
description = "Multi-dimensional medical decision engine — Strata-Oblivion Kernel"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "HyyperNab", email = "nab.kta@gmail.com"},
]
keywords = [
    "pharmacogenomics",
    "medical-modeling",
    "game-theory",
    "deep-learning",
    "pharmacokinetics",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
cli = [
    "rich>=13.0",
    "click>=8.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "build>=0.10",
    "twine>=4.0",
    "rich>=13.0",
    "click>=8.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
moac-qmm = "moac_qmm.cli:main"

[project.urls]
Homepage = "https://github.com/HyyperNab/moac-qmm"
Documentation = "https://github.com/HyyperNab/moac-qmm/tree/main/docs"
Repository = "https://github.com/HyyperNab/moac-qmm"
Issues = "https://github.com/HyyperNab/moac-qmm/issues"
Changelog = "https://github.com/HyyperNab/moac-qmm/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "RUF"]
ignore = [
    "N806",  # PAYOFF_MATRIX etc. — v28 parity naming
    "N818",  # v28 exception names (StrataRejection, ...) are frozen API surface
    "SIM108",  # ternary rewrites hurt readability of the physics
]
allowed-confusables = ["α", "β", "γ", "δ", "µ", "²", "½", "→", "×", "≥", "≤", "·"]

[tool.ruff.lint.per-file-ignores]
"legacy/*" = ["ALL"]  # v28 reference artifact, frozen verbatim
"tests/*" = ["S101"]  # asserts are the point
"src/moac_qmm/deep_learning/neural_pk.py" = ["N803"]  # X/y are conventional ML names

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["moac_qmm.api", "moac_qmm.cli"]
ignore_errors = true  # click/fastapi shims; type-checked at runtime contracts

[tool.coverage.run]
source = ["src/moac_qmm"]
omit = ["tests/*", "examples/*", "legacy/*"]
